[project]
name = "ci-triage"
version = "0.1.0"
description = "AI-assisted investigation and triage of failed GitHub Actions CI runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` tests call a real local model server; run them with `pytest -m slow`.
addopts = "-ra -m 'not slow'"
markers = ["slow: needs a running local model (Ollama)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
